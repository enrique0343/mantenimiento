name = "mantenimiento-cron"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Preventivos: 12:00 UTC = 06:00 de El Salvador. El segundo horario es solo SGO.
[triggers]
crons = ["0 12 * * *", "5 * * * *"]

[vars]
APP_URL = "https://mantenimiento-49c.pages.dev"
SGO_INTEGRATION_ENABLED = "true"
SGO_API_ORIGIN = "https://mantenimiento.complejoavante.dev"
# CRON_SECRET se configura como secret con: wrangler secret put CRON_SECRET
# SGO_PUBLISH_SECRET también es un secret; nunca se guarda en este archivo.
